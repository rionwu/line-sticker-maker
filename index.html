<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 動態貼圖 AI 影格生成器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #00b900; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 進度條樣式 */
        .progress-box { display: none; margin-top: 15px; }
        .progress-bar-bg { width: 100%; background: #e0e0e0; height: 18px; border-radius: 9px; overflow: hidden; position: relative; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00b900, #00e600); transition: width 0.3s ease; }
        .progress-text { text-align: center; font-size: 0.85rem; color: #666; margin-top: 6px; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .grid img { width: 100%; height: auto; border: 1px solid #eee; border-radius: 6px; background: #eee; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎨 LINE 動態貼圖生成器</h2>
    
    <label>1. Colab 算力網址 (HTTPS):</label>
    <input type="text" id="colabUrl" placeholder="https://xxxx.trycloudflare.com">

    <label>2. 上傳原始圖片:</label>
    <input type="file" id="imageInput" accept="image/*">

    <label>3. 動作描述 (Prompt):</label>
    <input type="text" id="promptInput" placeholder="例如：開心跳躍、眨眼手搖手">

    <label>4. 影格數量:</label>
    <select id="frameCount">
        <option value="15">15 幀 (LINE 貼圖標準)</option>
        <option value="8">8 幀</option>
    </select>

    <button id="generateBtn" onclick="generateFrames()">開始生成動態影格</button>

    <!-- 進度條元件 -->
    <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">AI 影格生成中... 0%</div>
    </div>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h3>🎬 生成結果 (共 <span id="frameCountText">0</span> 幀)</h3>
    <div class="grid" id="previewGrid"></div>
</div>

<script>
let progressTimer = null;

async function generateFrames() {
    const colabUrl = document.getElementById('colabUrl').value.trim().replace(/\/$/, "");
    const imageFile = document.getElementById('imageInput').files[0];
    const prompt = document.getElementById('promptInput').value.trim();
    const frameCount = document.getElementById('frameCount').value;

    if (!colabUrl || !imageFile) {
        alert('請確實填寫 Colab 網址並選擇圖片！');
        return;
    }

    const btn = document.getElementById('generateBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    btn.disabled = true;
    btn.innerText = '處理中...';
    progressBox.style.display = 'block';

    // 啟動擬真進度條 (平滑跑動至 95%，等待 API 完成後衝至 100%)
    let currentPercent = 0;
    progressFill.style.width = '0%';
    progressText.innerText = 'AI 影格生成中... 0%';

    progressTimer = setInterval(() => {
        if (currentPercent < 90) {
            currentPercent += Math.floor(Math.random() * 5) + 2; // 隨機增加 2%~6%
            if (currentPercent > 90) currentPercent = 90;
            progressFill.style.width = `${currentPercent}%`;
            progressText.innerText = `AI 影格生成中... ${currentPercent}%`;
        }
    }, 400);

    const formData = new FormData();
    formData.append('image', imageFile);
    formData.append('prompt', prompt);
    formData.append('frame_count', frameCount);

    try {
        const response = await fetch(`${colabUrl}/generate-frames`, {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();

        if (data.status === 'success' && data.frames) {
            // 完成時衝爆至 100%
            clearInterval(progressTimer);
            progressFill.style.width = '100%';
            progressText.innerText = '完成！100%';

            setTimeout(() => {
                renderRealFrames(data.frames);
                document.getElementById('resultCard').style.display = 'block';
                progressBox.style.display = 'none';
            }, 500);
        } else {
            alert('生成失敗：' + (data.message || '未知錯誤'));
            progressBox.style.display = 'none';
        }
    } catch (err) {
        alert('連線失敗！請檢查 Colab 是否正常運作且網址輸入正確。');
        console.error(err);
        progressBox.style.display = 'none';
    } finally {
        clearInterval(progressTimer);
        btn.disabled = false;
        btn.innerText = '開始生成動態影格';
    }
}

function renderRealFrames(framesArray) {
    const grid = document.getElementById('previewGrid');
    grid.innerHTML = '';
    document.getElementById('frameCountText').innerText = framesArray.length;

    framesArray.forEach((frameBase64, index) => {
        const img = document.createElement('img');
        img.src = frameBase64;
        img.title = `第 ${index + 1} 幀`;
        grid.appendChild(img);
    });
}
</script>

</body>
</html>
